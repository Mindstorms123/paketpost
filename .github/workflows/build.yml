name: Pages + Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bun install
      - run: npx vite build
        env:
          STATIC_BUILD: "1"
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Collect static files
        run: |
          IDX=$(find dist .output -name index.html -not -path "*/server/*" 2>/dev/null | head -1)
          echo "found $IDX"; test -n "$IDX"
          rm -rf web && cp -r "$(dirname "$IDX")" web
      - run: cp web/index.html web/404.html && touch web/.nojekyll
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: bun install
      - run: npx vite build
        env: { STATIC_BUILD: "1", BASE_PATH: / }
      - name: Collect static files
        run: |
          IDX=$(find dist .output -name index.html -not -path "*/server/*" 2>/dev/null | head -1)
          echo "found $IDX"; test -n "$IDX"
          rm -rf web && cp -r "$(dirname "$IDX")" web
      - run: npx cap add android && npx cap sync android
      - name: Icon
        run: |
          for d in android/app/src/main/res/mipmap-*; do
            for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
              [ -f "$d/$f" ] && cp public/icon-512.png "$d/$f"
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
      # Rising version number so Android accepts the new APK as an update.
      - name: Version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - run: ./gradlew assembleRelease
        working-directory: android
      # Always signed with the same stored key, otherwise Android refuses updates.
      - name: Sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias paketpost --ks-pass env:KS_PW --key-pass env:KS_PW --out Paketpost.apk aligned.apk
      # A fresh tag per build so every build shows up as its own new release.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Paketpost 1.0.${{ github.run_number }}
          body: Neue Android-App. Paketpost.apk herunterladen und installieren.
          files: Paketpost.apk
          make_latest: true
