name: Pages + Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bun install
      - run: npx vite build
        env:
          STATIC_BUILD: "1"
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: cp dist/client/index.html dist/client/404.html && touch dist/client/.nojekyll
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/client }
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: bun install
      - run: npx vite build
        env: { STATIC_BUILD: "1", BASE_PATH: / }
      - run: npx cap add android && npx cap sync android
      - name: Icon
        run: |
          for d in android/app/src/main/res/mipmap-*; do
            for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
              [ -f "$d/$f" ] && cp public/icon-512.png "$d/$f"
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
      - run: ./gradlew assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Paketpost.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Paketpost (neueste Version)
          files: Paketpost.apk
          make_latest: true
